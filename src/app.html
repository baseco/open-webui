<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="/static/favicon.png" />
		<link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
		<link rel="shortcut icon" href="/static/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Channel AI" />
		<link rel="manifest" href="/manifest.json" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#171717" />
		<meta name="robots" content="noindex,nofollow" />
		<meta name="description" content="Channel AI" />
		<link
			rel="search"
			type="application/opensearchdescription+xml"
			title="Channel AI"
			href="/opensearch.xml"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
		<script src="/static/loader.js" defer></script>
		
		<!-- Add Lottie player web component (much more reliable) -->
		<script src="https://unpkg.com/@lottiefiles/lottie-player@1.7.1/dist/lottie-player.js"></script>

		<script>
			function resizeIframe(obj) {
				obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
			}
		</script>
		
		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'system';
				}

				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
				} else if (localStorage.theme === 'oled-dark') {
					document.documentElement.style.setProperty('--color-gray-800', '#101010');
					document.documentElement.style.setProperty('--color-gray-850', '#050505');
					document.documentElement.style.setProperty('--color-gray-900', '#000000');
					document.documentElement.style.setProperty('--color-gray-950', '#000000');
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#000000');
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');
				} else if (localStorage.theme === 'her') {
					document.documentElement.classList.add('dark');
					document.documentElement.classList.add('her');
					metaThemeColorTag.setAttribute('content', '#983724');
				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#171717');
				}

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#171717');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
					}
				});

				// Add debug flag for splash screen testing
				const urlParams = new URLSearchParams(window.location.search);
				if (urlParams.get('debug_splash') === 'true') {
					window.debugSplash = true;
					console.log('Splash screen debug mode activated - splash will remain visible');
				}

				// Hide the her-specific elements by default
				document.addEventListener('DOMContentLoaded', function() {
					const logoHer = document.getElementById('logo-her');
					const progressBackground = document.getElementById('progress-background');
					const progressBar = document.getElementById('progress-bar');
					
					if (logoHer) logoHer.style.display = 'none';
					if (progressBackground) progressBackground.style.display = 'none';
					if (progressBar) progressBar.style.display = 'none';
					
					// Only show her elements if in her theme
					if (document.documentElement.classList.contains('her')) {
						if (logoHer) logoHer.style.display = 'block';
						if (progressBackground) progressBackground.style.display = 'block';
						if (progressBar) progressBar.style.display = 'block';
					}
				});
			})();
		</script>

		<title>Channel AI</title>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<div
			id="splash-screen"
			style="position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%"
		>
			<style type="text/css" nonce="">
				html {
					overflow-y: scroll !important;
				}
			</style>

			<div
				id="logo-container"
				style="
					position: absolute;
					width: 10rem;
					height: 10rem;
					top: 44%;
					left: 50%;
					transform: translateX(-50%);
					z-index: 101;
				"
			>
				<!-- Use lottie-player web component for reliability -->
				<script>
					document.addEventListener('DOMContentLoaded', function() {
						const isDark = document.documentElement.classList.contains('dark');
						const animPath = isDark ? '/auth/animations/logo_mark-white.json' : '/auth/animations/logo_mark-black.json';
						
						// Create lottie-player element
						const container = document.getElementById('logo-container');
						container.innerHTML = '';
						
						const player = document.createElement('lottie-player');
						player.setAttribute('src', animPath);
						player.setAttribute('background', 'transparent');
						player.setAttribute('speed', '1');
						player.setAttribute('loop', '');
						player.setAttribute('autoplay', '');
						player.style.width = '100%';
						player.style.height = '100%';
						
						container.appendChild(player);
						
						// Add error handler
						player.addEventListener('error', function(e) {
							console.error('Lottie player error:', e);
							container.innerHTML = '<img src="/auth/channel-logo.png" alt="Splash screen logo" style="width:100%; height:100%; object-fit:contain;">';
						});
					});
				</script>
				
				<!-- Fallback content if script fails to run -->
				<img src="/auth/channel-logo.png" alt="Splash screen logo" style="width:100%; height:100%; object-fit:contain;">
			</div>
			
			<div
				style="
					position: absolute;
					top: 33%;
					left: 50%;

					width: 24rem;
					transform: translateX(-50%);

					display: flex;
					flex-direction: column;
					align-items: center;
				"
			>
				<img
					id="logo-her"
					style="width: auto; height: 13rem"
					src="/static/splash.png"
					class="animate-pulse-fast"
				/>

				<div style="position: relative; width: 24rem; margin-top: 0.5rem">
					<div
						id="progress-background"
						style="
							position: absolute;
							width: 100%;
							height: 0.75rem;

							border-radius: 9999px;
							background-color: #fafafa9a;
						"
					></div>

					<div
						id="progress-bar"
						style="
							position: absolute;
							width: 0%;
							height: 0.75rem;
							border-radius: 9999px;
							background-color: #fff;
						"
						class="bg-white"
					></div>
				</div>
			</div>
		</div>
	</body>
</html>

<style type="text/css" nonce="">
	html {
		overflow-y: hidden !important;
	}

	#splash-screen {
		background: #fff;
	}

	.dark #splash-screen {
		background: #171717;
	}

	@keyframes pulse-animation {
		0% {
			opacity: 1;
		}
		50% {
			opacity: 0.1;
		}
		100% {
			opacity: 1;
		}
	}

	.animate-pulse-fast {
		animation: pulse-animation 1.7s infinite;
	}
</style>
